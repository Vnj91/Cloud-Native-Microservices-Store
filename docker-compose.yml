services:
  discovery-service:
    image: vnj91/discovery-service:latest
    build:
      context: ./services/discovery-service
    ports:
      - "8761:8761"
    networks:
      - devops-store-network
    volumes:
      - ~/.m2:/root/.m2
  api-gateway:
    image: vnj91/api-gateway:latest
    build:
      context: ./services/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
    networks:
      - devops-store-network
    volumes:
      - ~/.m2:/root/.m2
  product-service:
    image: vnj91/product-service
    build:
      context: ./services/product-service
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
      - product-db
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://product-db:5432/product_db
    networks:
      - devops-store-network
    volumes:
      - ~/.m2:/root/.m2
  order-service:
    image: vnj91/order-service
    build:
      context: ./services/order-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
      - order-db
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order_db
    networks:
      - devops-store-network
    volumes:
      - ~/.m2:/root/.m2
  user-service:
    image: vnj91/user-service
    build:
      context: ./services/user-service
    ports:
      - "8083:8083"
    depends_on:
      - discovery-service
      - user-db
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/user_db
    networks:
      - devops-store-network
    volumes:
      - ~/.m2:/root/.m2
  frontend:
    build:
      context: ./services/frontend
    ports:
      - "5173:80"
    networks:
      - devops-store-network
    depends_on:
      - api-gateway

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  devops-store-network:
    name: devops-store-network
volumes:
  product-db-data:
  user-db-data:
  order-db-data:

